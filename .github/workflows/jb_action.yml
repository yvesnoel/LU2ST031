name: deploy-book

on:
  push:
    branches:
    - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # ── Environnement 1 : JupyterBook (JupyterLab 3.x) ──────────────────────
    - name: Build JupyterBook
      run: |
        python -m venv venv_book
        venv_book/bin/pip install --quiet "jupyter-book<2" jupyterlab-myst
        venv_book/bin/jupyter-book build .

    # ── Environnement 2 : JupyterLite (JupyterLab 4.x, Pyodide 0.26) ───────
    - name: Build JupyterLite
      run: |
        python -m venv venv_lite
        venv_lite/bin/pip install --quiet \
          "jupyterlite-core>=0.8.0,<0.9" \
          "jupyterlab>=4.0.0,<5" \
          "jupyterlite-pyodide-kernel>=0.8.0,<0.9" \
          jupyterlab-myst \
          "ipywidgets>=8.0.0,<9" \
          "ipympl>=0.9.0" \
          "plotly>=5,<6" \
          ipyleaflet

        # Copier les notebooks dans content/
        cp README.md content
        cp -r CM* content/

        # Corriger le nom du kernel : "python3" → "python" (Pyodide)
        # DOIT tourner après la copie des notebooks dans content/
        python3 -c "
        import json, pathlib
        fixed = 0
        for p in pathlib.Path('content').rglob('*.ipynb'):
            nb = json.loads(p.read_text())
            ks = nb.setdefault('metadata', {}).setdefault('kernelspec', {})
            if ks.get('name') != 'python':
                ks.update({'name': 'python', 'display_name': 'Python (Pyodide)', 'language': 'python'})
                p.write_text(json.dumps(nb, ensure_ascii=False))
                print('Fixed:', p)
                fixed += 1
        print('Total fixed:', fixed)
        "

        # Désactiver TOC et masquer le filebrowser au démarrage
        echo '{"@jupyterlab/toc-extension:plugin":{"enabled":false},"@jupyterlab/filebrowser-extension:browser":{"startHidden":true}}' > overrides.json

        venv_lite/bin/jupyter lite build --contents content --output-dir dist
        cp -r _build/html dist/

    # ── Cross-Origin Isolation pour Chrome (SharedArrayBuffer) ───────────────
    - name: Inject coi-serviceworker
      run: |
        curl -sL -o dist/coi-serviceworker.min.js \
          https://cdn.jsdelivr.net/npm/coi-serviceworker@0.1.7/coi-serviceworker.min.js
        if [ -f dist/lab/index.html ]; then
          sed -i 's|<head>|<head><script src="../coi-serviceworker.min.js"></script>|' dist/lab/index.html
          echo "Patched: dist/lab/index.html"
        fi
        if [ -f dist/index.html ]; then
          sed -i 's|<head>|<head><script src="./coi-serviceworker.min.js"></script>|' dist/index.html
          echo "Patched: dist/index.html"
        fi

    # ── Replier la barre latérale gauche par défaut ───────────────────────────
    - name: Collapse sidebar by default
      run: |
        if [ -f dist/lab/index.html ]; then
          python3 -c "
        import pathlib
        path = pathlib.Path('dist/lab/index.html')
        script = '''<script>
        (function() {
          var attempts = 0;
          function tryCollapse() {
            if (attempts++ >= 30) return;
            if (window.jupyterapp && window.jupyterapp.shell) {
              setTimeout(function() {
                try { window.jupyterapp.shell.collapseLeft(); } catch(e) {}
              }, 800);
              return;
            }
            setTimeout(tryCollapse, 500);
          }
          setTimeout(tryCollapse, 1000);
        })();
        </script>'''
        html = path.read_text()
        html = html.replace('</body>', script + '</body>', 1)
        path.write_text(html)
        print('Patched: sidebar collapsed by default')
          "
        fi

    # ── HTML autonomes pour Moodle ───────────────────────────────────────────
    # Source : HTML JupyterBook (_build/html) → admonitions MyST déjà rendues
    - name: Build Moodle HTML
      run: |
        venv_book/bin/pip install --quiet beautifulsoup4 lxml
        mkdir -p dist/moodle

        python3 << 'PYEOF'
import pathlib, base64, sys
from bs4 import BeautifulSoup

build_dir = pathlib.Path('_build/html')
moodle_dir = pathlib.Path('dist/moodle')

# CSS Pygments (coloration syntaxique) généré par JupyterBook
pygments_css = ''
for css_path in sorted((build_dir / '_static').glob('pygments*.css')):
    pygments_css = css_path.read_text('utf-8')
    break

STYLE = f'''<style>
{pygments_css}
body{{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
     font-size:16px;line-height:1.6;color:#333;max-width:900px;margin:0 auto;padding:1.5em}}
h1,h2,h3,h4{{color:#2c3e50;margin-top:1.4em}}
p{{margin:.6em 0}}
pre{{background:#f8f8f8;padding:1em;border-radius:4px;overflow-x:auto;font-size:.9em}}
code{{background:#f0f0f0;padding:.15em .4em;border-radius:3px;font-size:.9em}}
pre code{{background:none;padding:0}}
img{{max-width:100%;height:auto}}
table{{border-collapse:collapse;width:100%;margin:1em 0}}
th,td{{border:1px solid #ddd;padding:8px;text-align:left}}
th{{background:#f2f2f2;font-weight:bold}}
blockquote{{border-left:4px solid #ccc;margin:1em 0;padding:.5em 1em;color:#555}}
/* Admonitions MyST / Sphinx */
.admonition{{padding:.8em 1em;border-left:4px solid;border-radius:0 4px 4px 0;margin:1.2em 0}}
.admonition-title{{font-weight:bold;margin:0 0 .4em;text-transform:capitalize}}
.admonition-title::before{{margin-right:.4em}}
.admonition.note,.admonition.seealso{{background:#e8f4fd;border-color:#3498db}}
.admonition.note .admonition-title,.admonition.seealso .admonition-title{{color:#1a5276}}
.admonition.tip,.admonition.hint{{background:#e9f7ef;border-color:#27ae60}}
.admonition.tip .admonition-title,.admonition.hint .admonition-title{{color:#1e8449}}
.admonition.warning,.admonition.attention,.admonition.caution{{background:#fef9e7;border-color:#f39c12}}
.admonition.warning .admonition-title{{color:#9a6e00}}
.admonition.danger,.admonition.error{{background:#fdecea;border-color:#e74c3c}}
.admonition.danger .admonition-title,.admonition.error .admonition-title{{color:#922b21}}
.admonition.important{{background:#f4ecff;border-color:#8e44ad}}
.admonition.important .admonition-title{{color:#6c3483}}
/* Numéros de cellules masqués */
.prompt{{display:none}}
</style>'''

for nb_path in sorted(pathlib.Path('.').glob('CM*/*.ipynb')):
    jb_html = build_dir / nb_path.with_suffix('.html')
    if not jb_html.exists():
        print(f'  Manquant: {jb_html} — skipping', file=sys.stderr)
        continue

    out_dir = moodle_dir / nb_path.parent
    out_dir.mkdir(parents=True, exist_ok=True)

    soup = BeautifulSoup(jb_html.read_text('utf-8'), 'lxml')

    # Contenu principal (JupyterBook / Sphinx Book Theme)
    main = (soup.find('div', role='main')
            or soup.find('article')
            or soup.find('div', class_='bd-article')
            or soup.find('section'))

    if not main:
        print(f'  Contenu principal introuvable: {jb_html}', file=sys.stderr)
        continue

    # Supprimer liens de navigation prev/next, ancres "#", badges
    for sel in ['.prev-next', '.footer-item',
                'a.headerlink', '.sd-badge', '.cell_tag']:
        for el in main.select(sel):
            el.decompose()

    # Embarquer les images locales en base64
    for img in main.find_all('img'):
        src = img.get('src', '')
        if src.startswith('data:') or src.startswith('http'):
            continue
        img_path = (jb_html.parent / src).resolve()
        if img_path.exists():
            ext = img_path.suffix.lstrip('.').lower()
            if ext == 'jpg': ext = 'jpeg'
            b64 = base64.b64encode(img_path.read_bytes()).decode()
            img['src'] = f'data:image/{ext};base64,{b64}'
        else:
            print(f'    Image manquante: {img_path}', file=sys.stderr)

    html_out = f'''<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{nb_path.stem.replace("_"," ")}</title>
{STYLE}
<script>
/* Charge MathJax uniquement si pas déjà présent (Moodle l'a souvent) */
if (typeof MathJax === "undefined") {{
  window.MathJax = {{
    tex: {{
      inlineMath: [["\\\\(","\\\\)"]],
      displayMath: [["\\\\[","\\\\]"]]
    }},
    options: {{ skipHtmlTags: ["script","noscript","style","textarea","pre"] }}
  }};
  var s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js";
  s.async = true;
  document.head.appendChild(s);
}}
</script>
</head>
<body>
{main.decode_contents()}
</body>
</html>'''

    out_file = out_dir / (nb_path.stem + '.html')
    out_file.write_text(html_out, encoding='utf-8')
    print(f'  OK: {out_file}')

print('HTML Moodle terminé.')
PYEOF

        # ZIP de l'arborescence complète
        (cd dist/moodle && zip -r ../../dist/moodle_notebooks.zip .)
        echo "ZIP créé : dist/moodle_notebooks.zip ($(du -h dist/moodle_notebooks.zip | cut -f1))"
        echo "Arborescence :"
        find dist/moodle -name '*.html' | sort

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    needs: deploy-book
    if: github.ref == 'refs/heads/master'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
