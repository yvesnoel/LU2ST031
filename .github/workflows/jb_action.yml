name: deploy-book

on:
  push:
    branches:
    - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # ── Environnement 1 : JupyterBook (JupyterLab 3.x) ──────────────────────
    - name: Build JupyterBook
      run: |
        python -m venv venv_book
        venv_book/bin/pip install --quiet "jupyter-book<2" jupyterlab-myst beautifulsoup4 lxml
        venv_book/bin/jupyter-book build .

    # ── Environnement 2 : JupyterLite (JupyterLab 4.x, Pyodide 0.26) ───────
    - name: Build JupyterLite
      run: |
        python -m venv venv_lite
        venv_lite/bin/pip install --quiet \
          "jupyterlite-core>=0.8.0,<0.9" \
          "jupyterlab>=4.0.0,<5" \
          "jupyterlite-pyodide-kernel>=0.8.0,<0.9" \
          jupyterlab-myst \
          "ipywidgets>=8.0.0,<9" \
          "ipympl>=0.9.0" \
          "plotly>=5,<6" \
          ipyleaflet

        # Copier les notebooks dans content/
        cp README.md content
        cp -r CM* content/

        # Corriger le nom du kernel : "python3" → "python" (Pyodide)
        python3 -c "
        import json, pathlib
        fixed = 0
        for p in pathlib.Path('content').rglob('*.ipynb'):
            nb = json.loads(p.read_text())
            ks = nb.setdefault('metadata', {}).setdefault('kernelspec', {})
            if ks.get('name') != 'python':
                ks.update({'name': 'python', 'display_name': 'Python (Pyodide)', 'language': 'python'})
                p.write_text(json.dumps(nb, ensure_ascii=False))
                print('Fixed:', p)
                fixed += 1
        print('Total fixed:', fixed)
        "

        # Désactiver TOC et masquer le filebrowser au démarrage
        echo '{"@jupyterlab/toc-extension:plugin":{"enabled":false},"@jupyterlab/filebrowser-extension:browser":{"startHidden":true}}' > overrides.json

        venv_lite/bin/jupyter lite build --contents content --output-dir dist
        cp -r _build/html dist/

    # ── HTML autonomes pour Moodle ───────────────────────────────────────────
    # Placé APRÈS JupyterLite pour éviter que jupyter lite build écrase dist/moodle
    # Source : HTML JupyterBook (_build/html) → admonitions MyST déjà rendues
    - name: Build Moodle HTML
      run: |
        mkdir -p dist/moodle
        venv_book/bin/python3 .github/scripts/build_moodle_html.py
        (cd dist/moodle && zip -r ../../dist/moodle_notebooks.zip .)
        echo "ZIP créé : dist/moodle_notebooks.zip ($(du -h dist/moodle_notebooks.zip | cut -f1))"
        find dist/moodle -name '*.html' | sort

    # ── Cross-Origin Isolation pour Chrome (SharedArrayBuffer) ───────────────
    - name: Inject coi-serviceworker
      run: |
        curl -sL -o dist/coi-serviceworker.min.js \
          https://cdn.jsdelivr.net/npm/coi-serviceworker@0.1.7/coi-serviceworker.min.js
        if [ -f dist/lab/index.html ]; then
          sed -i 's|<head>|<head><script src="../coi-serviceworker.min.js"></script>|' dist/lab/index.html
          echo "Patched: dist/lab/index.html"
        fi
        if [ -f dist/index.html ]; then
          sed -i 's|<head>|<head><script src="./coi-serviceworker.min.js"></script>|' dist/index.html
          echo "Patched: dist/index.html"
        fi

    # ── Replier la barre latérale gauche par défaut ───────────────────────────
    - name: Collapse sidebar by default
      run: |
        if [ -f dist/lab/index.html ]; then
          python3 -c "
        import pathlib
        path = pathlib.Path('dist/lab/index.html')
        script = '''<script>
        (function() {
          var attempts = 0;
          function tryCollapse() {
            if (attempts++ >= 30) return;
            if (window.jupyterapp && window.jupyterapp.shell) {
              setTimeout(function() {
                try { window.jupyterapp.shell.collapseLeft(); } catch(e) {}
              }, 800);
              return;
            }
            setTimeout(tryCollapse, 500);
          }
          setTimeout(tryCollapse, 1000);
        })();
        </script>'''
        html = path.read_text()
        html = html.replace('</body>', script + '</body>', 1)
        path.write_text(html)
        print('Patched: sidebar collapsed by default')
          "
        fi

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    needs: deploy-book
    if: github.ref == 'refs/heads/master'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
