name: deploy-book

# Only run this when the master branch changes
on:
  push:
    branches:
    - master

# This job installs dependencies, builds the book, and pushes it to `gh-pages`
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # -----------------------------------------------------------------------
    # ÉTAPE 1 : construction du JupyterBook (requiert JupyterLab 3.x)
    # jupyter-book v1 s'appuie sur Sphinx, pas sur JupyterLab à l'exécution.
    # -----------------------------------------------------------------------
    - name: Install JupyterBook dependencies
      run: |
        pip install "jupyter-book<2" jupyterlab-myst

    - name: Build the book
      run: |
        jupyter-book build .

    # -----------------------------------------------------------------------
    # ÉTAPE 2 : construction du site JupyterLite (requiert JupyterLab 4.x)
    # On installe jupyterlab 4 + jupyterlite-core 0.2 + pyodide-kernel 0.1
    # APRÈS avoir construit le book, pour éviter le conflit de dépendances.
    # jupyterlite-pyodide-kernel >=0.1 embarque Pyodide 0.22+ qui corrige
    # le crash Chrome ("atime" null) présent dans Pyodide 0.21.
    # -----------------------------------------------------------------------
    - name: Install JupyterLite dependencies
      run: |
        pip install \
          "jupyterlite-core>=0.2.0,<0.3" \
          "jupyterlab>=4.0.0,<5" \
          "jupyterlite-pyodide-kernel>=0.1.0,<0.2" \
          "ipywidgets>=8.0.0,<9" \
          "ipympl>=0.9.0" \
          "plotly>=5,<6" \
          ipyleaflet

    - name: Build the JupyterLite site
      run: |
        cp README.md content
        cp -r CM* content/
        jupyter lite build --contents content --output-dir dist
        cp -r _build/html dist/

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    needs: deploy-book
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
