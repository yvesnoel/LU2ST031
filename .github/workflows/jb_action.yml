name: deploy-book

on:
  push:
    branches:
    - master

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # Toutes les dépendances dans un seul environnement :
    # - jupyter-book<2 et jupyterlite-core 0.1.x requièrent tous deux JupyterLab 3.x → pas de conflit
    # - jupyterlite-pyodide-kernel>=0.1.0 embarque Pyodide 0.22 (vs 0.21 dans 0.0.10)
    #   ce qui corrige le crash Chrome "TypeError: Cannot read properties of null (reading 'atime')"
    - name: Install dependencies
      run: |
        pip install \
          "jupyter-book<2" \
          jupyterlab-myst \
          "jupyterlite-core>=0.1.1,<0.2" \
          "jupyterlite-pyodide-kernel>=0.1.0,<0.2" \
          "ipywidgets>=8.0.0,<9" \
          "ipympl>=0.9.0" \
          "plotly>=5,<6" \
          ipyleaflet

    - name: Build the book
      run: |
        jupyter-book build .

    - name: Build the JupyterLite site
      run: |
        cp README.md content
        cp -r CM* content/
        jupyter lite build --contents content --output-dir dist
        cp -r _build/html dist/

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    needs: deploy-book
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
