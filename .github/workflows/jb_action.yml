name: deploy-book

on:
  push:
    branches:
    - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # ── Environnement 1 : JupyterBook ────────────────────────────────────────
    - name: Build JupyterBook
      run: |
        python -m venv venv_book
        venv_book/bin/pip install --quiet "jupyter-book<2" jupyterlab-myst beautifulsoup4 lxml
        venv_book/bin/jupyter-book build .

    # ── Environnement 2 : JupyterLite (Pyodide kernel) ──────────────────────
    - name: Build JupyterLite
      run: |
        python -m venv venv_lite

        # N'installer QUE jupyterlite-core et le kernel Pyodide.
        # Les autres packages (ipywidgets, ipympl, plotly, jupyterlab-myst…)
        # embarquent des labextensions JS incompatibles avec le bundle pré-compilé
        # de jupyterlite-core → "Cannot set properties of undefined" → page blanche.
        # numpy, matplotlib, pandas, ipywidgets… sont fournis par Pyodide sans rien installer.
        venv_lite/bin/pip install --quiet \
          "jupyterlite-core>=0.8.0,<0.9" \
          "jupyterlite-pyodide-kernel>=0.8.0,<0.9" \
          "jupyter-server>=2.0,<3" \
          "jupyterlab-myst"
        # jupyterlab-myst sans pin de version : pip résout la version de jupyterlab
        # compatible avec jupyterlite-core 0.8.x via ses dépendances déclarées.
        # NE PAS ajouter d'autres packages ici (ipywidgets, ipympl, plotly…) :
        # leurs labextensions JS sont incompatibles avec le bundle pré-compilé.

        # S'assurer que le dossier content/ existe
        mkdir -p content

        # Copier les notebooks dans content/
        cp README.md content/
        cp -r CM* content/

        # Corriger le nom du kernel : "python3" → "python" (Pyodide)
        venv_lite/bin/python3 -c "
        import json, pathlib
        fixed = 0
        for p in pathlib.Path('content').rglob('*.ipynb'):
            nb = json.loads(p.read_text())
            ks = nb.setdefault('metadata', {}).setdefault('kernelspec', {})
            if ks.get('name') != 'python':
                ks.update({'name': 'python', 'display_name': 'Python (Pyodide)', 'language': 'python'})
                p.write_text(json.dumps(nb, ensure_ascii=False))
                print('Fixed:', p)
                fixed += 1
        print('Total fixed:', fixed)
        "

        # NE PAS écrire d'overrides.json ici : des IDs de plugins invalides
        # peuvent crasher le système de settings de JupyterLite au démarrage.

        venv_lite/bin/jupyter lite build --contents content --output-dir dist
        cp -r _build/html dist/

    # ── HTML autonomes pour Moodle ───────────────────────────────────────────
    - name: Build Moodle HTML
      run: |
        mkdir -p dist/moodle
        venv_book/bin/python3 .github/scripts/build_moodle_html.py
        (cd dist/moodle && zip -r ../../dist/moodle_notebooks.zip .)
        echo "ZIP créé : dist/moodle_notebooks.zip ($(du -h dist/moodle_notebooks.zip | cut -f1))"
        find dist/moodle -name '*.html' | sort

    # ── Cross-Origin Isolation pour Chrome (SharedArrayBuffer / Pyodide) ─────
    - name: Inject coi-serviceworker
      run: |
        curl -sL -o dist/coi-serviceworker.min.js \
          https://cdn.jsdelivr.net/npm/coi-serviceworker@0.1.7/coi-serviceworker.min.js

        # Injecter juste avant </head> (plus robuste que après <head>)
        if [ -f dist/lab/index.html ]; then
          sed -i 's|</head>|<script src="../coi-serviceworker.min.js"></script></head>|' dist/lab/index.html
          echo "Patched: dist/lab/index.html"
        fi
        if [ -f dist/index.html ]; then
          sed -i 's|</head>|<script src="./coi-serviceworker.min.js"></script></head>|' dist/index.html
          echo "Patched: dist/index.html"
        fi

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    needs: deploy-book
    if: github.ref == 'refs/heads/master'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
