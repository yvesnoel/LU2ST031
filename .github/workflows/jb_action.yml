name: deploy-book

on:
  push:
    branches:
    - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # ── Environnement 1 : JupyterBook (JupyterLab 3.x) ──────────────────────
    - name: Build JupyterBook
      run: |
        python -m venv venv_book
        venv_book/bin/pip install --quiet "jupyter-book<2" jupyterlab-myst
        venv_book/bin/jupyter-book build .

    # ── Environnement 2 : JupyterLite (JupyterLab 4.x, Pyodide 0.23) ───────
    - name: Build JupyterLite
      run: |
        python -m venv venv_lite
        venv_lite/bin/pip install --quiet \
          "jupyterlite-core>=0.2.0,<0.3" \
          "jupyterlab>=4.0.0,<5" \
          "jupyterlite-pyodide-kernel>=0.2.0,<0.3" \
          "ipywidgets>=8.0.0,<9" \
          "ipympl>=0.9.0" \
          "plotly>=5,<6" \
          ipyleaflet
        cp README.md content
        cp -r CM* content/
        venv_lite/bin/jupyter lite build --contents content --output-dir dist
        cp -r _build/html dist/

    # ── Cross-Origin Isolation pour Chrome ───────────────────────────────────
    # Pyodide 0.23 requiert SharedArrayBuffer, qui n'est disponible que si
    # les headers COOP/COEP sont présents. GitHub Pages ne les envoie pas.
    # coi-serviceworker les ajoute côté client via un Service Worker.
    - name: Inject coi-serviceworker
      run: |
        # Télécharger le service worker
        curl -sL -o dist/coi-serviceworker.min.js \
          https://cdn.jsdelivr.net/npm/coi-serviceworker@0.1.7/coi-serviceworker.min.js

        # Injecter le script dans tous les index.html de JupyterLite
        # (exclut les fichiers du JupyterBook dans dist/html/)
        python3 - <<'EOF'
import pathlib

dist = pathlib.Path("dist")
patched = 0
for idx in dist.rglob("index.html"):
    # Exclure le dossier html/ (sortie du JupyterBook)
    if "html" in idx.relative_to(dist).parts:
        continue
    content = idx.read_text(encoding="utf-8")
    if "<head>" not in content or "coi-serviceworker" in content:
        continue
    # Calculer le chemin relatif vers dist/coi-serviceworker.min.js
    depth = len(idx.relative_to(dist).parts) - 1  # -1 pour le nom du fichier
    rel = "../" * depth if depth > 0 else "./"
    tag = f'<script src="{rel}coi-serviceworker.min.js"></script>'
    idx.write_text(content.replace("<head>", "<head>" + tag, 1), encoding="utf-8")
    print(f"Patched: {idx}")
    patched += 1
print(f"Total patched: {patched} file(s)")
EOF

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    needs: deploy-book
    if: github.ref == 'refs/heads/master'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
