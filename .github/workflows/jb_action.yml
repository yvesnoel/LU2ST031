name: deploy-book

on:
  push:
    branches:
    - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # ── Environnement 1 : JupyterBook ────────────────────────────────────────
    # jupyter-book v1 requiert JupyterLab 3.x.
    # On construit le book ici, dans un venv isolé.
    - name: Build JupyterBook (venv isolé, JupyterLab 3.x)
      run: |
        python -m venv venv_book
        venv_book/bin/pip install --quiet "jupyter-book<2" jupyterlab-myst
        venv_book/bin/jupyter-book build .

    # ── Environnement 2 : JupyterLite ────────────────────────────────────────
    # jupyterlite-core 0.2.x requiert JupyterLab 4.x.
    # jupyterlite-pyodide-kernel 0.2.x embarque Pyodide 0.23+,
    # qui corrige le crash Chrome "Cannot read properties of null (atime)".
    - name: Build JupyterLite (venv isolé, JupyterLab 4.x + Pyodide 0.23)
      run: |
        python -m venv venv_lite
        venv_lite/bin/pip install --quiet \
          "jupyterlite-core>=0.2.0,<0.3" \
          "jupyterlab>=4.0.0,<5" \
          "jupyterlite-pyodide-kernel>=0.2.0,<0.3" \
          "ipywidgets>=8.0.0,<9" \
          "ipympl>=0.9.0" \
          "plotly>=5,<6" \
          ipyleaflet
        cp README.md content
        cp -r CM* content/
        venv_lite/bin/jupyter lite build --contents content --output-dir dist
        cp -r _build/html dist/

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    needs: deploy-book
    if: github.ref == 'refs/heads/master'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
